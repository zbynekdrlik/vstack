# cargo-mutants config (issue 6). Each mutant is tested by its own crate's tests only: the default,
# never test_workspace = true. The vendored C codec is not Rust and is never mutated.
profile = "mutants"
test_tool = "nextest"
exclude_globs = ["jxs/sys/csrc/**"]
# cargo-mutants builds in copies of the tree with a cold target dir, so no CI cache step helps it.

# Equivalent mutants: at corr == +MAX_SLEW_NS the clamp returns stock + MAX_SLEW_NS, which is
# target; at corr == -MAX_SLEW_NS it returns stock - MAX_SLEW_NS, also target. Moving either
# boundary by one changes no output, so no test can catch them.
exclude_re = [
  '^rig/core/src/genlock_wall_step\.rs:[0-9]+:[0-9]+: replace > with >= in deadline_ns$',
  '^rig/core/src/genlock_wall_step\.rs:[0-9]+:[0-9]+: replace < with <= in deadline_ns$',
  # vstack#8: `ms > u32::MAX` saturates to u32::MAX; at ms == u32::MAX the cast gives the same
  # u32::MAX, so `>=` changes no output.
  '^rig/core/src/genlock_audio_pairing\.rs:[0-9]+:[0-9]+: replace > with >= in video_delay_round_ms$',
  # vstack#8, genlock_audio_step_hold, pinned to line:col (the same functions have caught mutants).
  # In audio_step_unmatched_follow the `&&` chain has already
  # required stamp_jump_ns != 0 and unmatched_ns != 0, so `> 0` / `>= 0` and `< 0` / `<= 0` agree.
  '^rig/core/src/genlock_audio_step_hold\.rs:543:27: replace > with >= in audio_step_unmatched_follow$',
  '^rig/core/src/genlock_audio_step_hold\.rs:543:51: replace < with <= in audio_step_unmatched_follow$',
  # In audio_relabel_pending a zero jump fails `jump > |step_min|`, whichever side whole_slot reads.
  '^rig/core/src/genlock_audio_step_hold\.rs:455:39: replace > with >= in audio_relabel_pending$',
  # In audio_step_hold's pending fold, dev_ns == 0 gives fold 0 on both sides: followed is 0, and the
  # relabel-shaped fold needs `0 > |step_min|`.
  '^rig/core/src/genlock_audio_step_hold\.rs:314:32: replace > with >= in audio_step_hold$',
  # vstack#8 batch 3, burn-geom, pinned to line:col. In slot_rect, side <= max_h = frame_h - 2 x margin
  # whenever frame_h > 2 x margin, so margin + side / 2 < frame_h and the two never meet. Otherwise
  # side is 1, half 0, and at frame_h == margin both branches give band_cy 0.
  '^av/burn/src/burn_regions\.rs:164:30: replace > with >= in slot_rect$',
  # In square_span, sh == sw has abs_diff 0 <= tol and has already returned, so `>=` reads no new case.
  '^av/burn/src/burn_quiet_zone\.rs:197:11: replace > with >= in square_span$',
]
