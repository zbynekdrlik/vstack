# cargo-mutants config (issue 6). Each mutant is tested by its own crate's tests only: the default,
# never test_workspace = true. The vendored C codec is not Rust and is never mutated.
profile = "mutants"
test_tool = "nextest"
exclude_globs = ["jxs/sys/csrc/**"]
# cargo-mutants builds in copies of the tree with a cold target dir, so no CI cache step helps it.

# Equivalent mutants: at corr == +MAX_SLEW_NS the clamp returns stock + MAX_SLEW_NS, which is
# target; at corr == -MAX_SLEW_NS it returns stock - MAX_SLEW_NS, also target. Moving either
# boundary by one changes no output, so no test can catch them.
exclude_re = [
  '^rig/core/src/genlock_wall_step\.rs:[0-9]+:[0-9]+: replace > with >= in deadline_ns$',
  '^rig/core/src/genlock_wall_step\.rs:[0-9]+:[0-9]+: replace < with <= in deadline_ns$',
  # vstack#8: `ms > u32::MAX` saturates to u32::MAX; at ms == u32::MAX the cast gives the same
  # u32::MAX, so `>=` changes no output.
  '^rig/core/src/genlock_audio_pairing\.rs:[0-9]+:[0-9]+: replace > with >= in video_delay_round_ms$',
  # vstack#8, genlock_audio_step_hold, pinned to line:col (the same functions have caught mutants).
  # In audio_step_unmatched_follow the `&&` chain has already
  # required stamp_jump_ns != 0 and unmatched_ns != 0, so `> 0` / `>= 0` and `< 0` / `<= 0` agree.
  '^rig/core/src/genlock_audio_step_hold\.rs:543:27: replace > with >= in audio_step_unmatched_follow$',
  '^rig/core/src/genlock_audio_step_hold\.rs:543:51: replace < with <= in audio_step_unmatched_follow$',
  # In audio_relabel_pending a zero jump fails `jump > |step_min|`, whichever side whole_slot reads.
  '^rig/core/src/genlock_audio_step_hold\.rs:455:39: replace > with >= in audio_relabel_pending$',
  # In audio_step_hold's pending fold, dev_ns == 0 gives fold 0 on both sides: followed is 0, and the
  # relabel-shaped fold needs `0 > |step_min|`.
  '^rig/core/src/genlock_audio_step_hold\.rs:314:32: replace > with >= in audio_step_hold$',
  # vstack#8 batch 3, burn-geom, pinned to line:col. In slot_rect, side <= max_h = frame_h - 2 x margin
  # whenever frame_h > 2 x margin, so margin + side / 2 < frame_h and the two never meet. Otherwise
  # side is 1, half 0, and at frame_h == margin both branches give band_cy 0.
  '^av/burn/src/burn_regions\.rs:164:30: replace > with >= in slot_rect$',
  # In square_span, sh == sw has abs_diff 0 <= tol and has already returned, so `>=` reads no new case.
  '^av/burn/src/burn_quiet_zone\.rs:197:11: replace > with >= in square_span$',
  # vstack#8 batch 2 tag A, pinned to line:col. In is_send_stall / is_capture_stall the first clause
  # already returned for frame_interval_ms <= 0, so the threshold interval x 1.5 is positive: a
  # duration <= 0 never reaches it, whether `< 0.0` reads `<= 0.0` or `== 0.0`.
  '^rig/core/src/send_stall\.rs:45:76: replace < with (<=|==) in is_send_stall$',
  '^av/capture/src/capture_stall\.rs:44:76: replace < with (<=|==) in is_capture_stall$',
  # In evaluate_wedge the same guard also returns Alive for threshold_s <= 0, and a progress age <= 0
  # is never >= a positive (or NaN) threshold: Alive either way.
  '^av/capture/src/capture_wedge\.rs:70:40: replace < with (<=|==) in evaluate_wedge$',
  # In frame_from_nonempty_queue `||` binds looser than `&&`: the mutant guard reads
  # A || (interval <= 0 && !finite(duration)) || duration < 0. A finite duration >= 0 against an
  # interval <= 0 then fails `duration < interval x 0.5`; a non-finite one fails it too (+inf, NaN)
  # or hits `duration < 0` (-inf). Not buffered on both sides.
  '^av/capture/src/capture_stall\.rs:110:9: replace \|\| with && in frame_from_nonempty_queue$',
  # In mean_chroma / luma_roughness a zero width or height loops zero times, so count stays 0 and
  # the fallback returns the same 0 as the early return.
  '^av/capture/src/capture\.rs:275:33: replace \|\| with && in mean_chroma$',
  '^av/capture/src/capture\.rs:353:33: replace \|\| with && in luma_roughness$',
  # In CaptureTally::record_sequence a zero gap adds 0 to dropped_captures; `>=` only adds a log line.
  '^av/capture/src/capture\.rs:787:20: replace > with >= in CaptureTally::record_sequence$',
  # In obs_frame_stamp_100ns frame_ts == mono_now maps the tick to wall_now; its nearest boundary is
  # floor(wall_now) or the next one, and the clamp to floor(wall_now) returns send_floor either way,
  # which is what `>=` returns.
  '^rig/core/src/genlock_stamp\.rs:118:24: replace > with >= in obs_frame_stamp_100ns$',
  # Device-bound, not equivalent: these run only against an open V4L2 device, and CI has none. The
  # accounting and decisions they call are pure and tested (CaptureTally, apply_controls_with,
  # frame_integrity_issue, ControlReport::has_issues); what is left is the ioctl plumbing, driven by
  # camera-box on the rig. query_card_name's error path is tested; `None` needs a real card.
  '^av/capture/src/capture\.rs:[0-9]+:[0-9]+: (replace|.* in) VideoCapture::[a-z_]+',
  '^av/capture/src/capture\.rs:[0-9]+:[0-9]+: (replace|.* in) <impl ControlIo for Device>::[a-z_]+',
  '^av/capture/src/capture\.rs:[0-9]+:[0-9]+: replace query_card_name -> Option<String> with None$',
  # vstack#8 batch 2 tag B, capture_phase, pinned to line:col. A run is held past 30 outliers only
  # while Forming (Step absorbs, Other re-seeds); Forming needs the last of at most 3 plateau starts
  # in the newest 3 samples, so it ends by run length 35, never at MAX_STAIRCASE_RUN (60).
  '^av/capture/src/capture_phase\.rs:513:79: replace < with <= in CapturePhaseTracker::observe$',
  # Window x values strictly increase, so 3 or more samples give d > 0: `d >= 0` reads no new case.
  '^av/capture/src/capture_phase\.rs:574:38: replace > with >= in CapturePhaseTracker::period_ns$',
  # residuals_are_white only reads |sum[q]|: `-=` builds each sum as the exact IEEE negation.
  '^av/capture/src/capture_phase\.rs:740:20: replace \+= with -= in CapturePhaseTracker::residuals_are_white$',
  # n >= 4 there, and q = 4i/n takes every value 0..3 (i = ceil(qn/4) < n): count[q] >= 1 always.
  '^av/capture/src/capture_phase\.rs:745:33: replace > with >= in CapturePhaseTracker::residuals_are_white$',
  # The source fit only keeps points with strictly increasing x and t, and shift moves every t
  # alike, so nb > 0 and d > 0: its period is never 0.0, and span > 0 or 3 points imply d > 0.
  '^av/capture/src/capture_phase\.rs:1038:31: replace > with >= in CapturePhase::source_rate_ppm$',
  '^av/capture/src/capture_phase/source_phase\.rs:136:83: replace > with >= in SourcePhase::ready$',
  '^av/capture/src/capture_phase/source_phase\.rs:148:38: replace > with >= in SourcePhase::period_ns$',
]
