name: Mutation sweep (full tree)

# Issue 6: the whole tree, on demand only (`gh workflow run mutation-full.yml`), never on a push or
# a schedule. CI mutates each change's own lines; this catches what those runs never touched.
# Missed mutants are filed as one issue labelled test-quality; the run fails only when the tooling
# fails.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.1"

concurrency:
  group: mutation-full
  cancel-in-progress: false

jobs:
  shard:
    name: Mutants shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          key: mutants-full
      # cargo-mutants exits 2 for missed mutants and 3 for timeouts: findings, filed below. Any
      # other non-zero exit is a tooling failure and fails the shard.
      - name: Mutate shard ${{ matrix.shard }}/8
        run: |
          set -uo pipefail
          cargo mutants --shard ${{ matrix.shard }}/8 --baseline=skip --timeout 120 --jobs 2 --all-features -- --all-targets
          rc=$?
          case "$rc" in
            0|2|3) echo "cargo-mutants exit $rc" ;;
            *) echo "::error::cargo-mutants failed to run (exit $rc)"; exit "$rc" ;;
          esac
          test -f mutants.out/outcomes.json
      - uses: actions/upload-artifact@v4
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: |
            mutants.out/missed.txt
            mutants.out/timeout.txt
            mutants.out/outcomes.json

  file:
    name: File missed mutants
    needs: [shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mutants-shard-*
      - name: One issue for every missed or timed-out mutant
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat mutants-shard-*/missed.txt mutants-shard-*/timeout.txt 2>/dev/null | sort -u > found.txt || true
          if [ ! -s found.txt ]; then echo "no missed mutants"; exit 0; fi
          gh label create test-quality --color FBCA04 --description "Missed mutants from the full sweep" 2>/dev/null || true
          {
            echo "The full mutation sweep (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}, commit ${GITHUB_SHA}) left these mutants alive. Each needs a test that fails on it, or an exclude in .cargo/mutants.toml with the reason it is equivalent."
            echo
            echo '```'
            cat found.txt
            echo '```'
          } > body.md
          gh issue create --title "Missed mutants: full sweep $(date -u +%F) ($(wc -l < found.txt))" --label test-quality --body-file body.md
