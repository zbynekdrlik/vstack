# Per-test slow-timeout, as camera-box ran these crates: a test still running after `period`
# is reported SLOW, and after `terminate-after` periods it is killed and named as a failure,
# so a hung test fails the job instead of running to the job's `timeout-minutes` cap.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 8 }
