[package]
name = "av-capture"
version.workspace = true
edition.workspace = true
description = "The cambox V4L2 capture side (camera-box #1487, vstack #8 batch 2): the capture device and its controls, the frame types the NDI sender takes, and the pure capture-rate, dequeue-stall and wedge decisions"
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
rig-core = { path = "../../rig/core" }

# Only the capture module (Linux only) uses these: v4l2-sys-mit builds its bindings from
# linux/videodev2.h. The decision modules stay portable (camera-box builds them for Windows).
[target.'cfg(target_os = "linux")'.dependencies]
anyhow = "1"
tracing = "0.1"
v4l = "0.14"
