# vstack: the shared Rust libraries for video switching and camboxes (split from camera-box,
# airuleset issue 1280, camera-box issue 1487). Apps pin a vstack tag (`vX.Y.Z`) as a git
# dependency; every member inherits the one version below, so a tag names one version of all.
[workspace]
members = ["av/burn", "av/marker", "jxs/sys", "jxs/link", "jxs/recv-ffi", "jxs/send-ffi", "rig/core"]
resolver = "2"

[workspace.package]
version = "0.1.8"
edition = "2021"
license = "MIT"

# The FFI archive (libjxs_recv_ffi.a) is built in a vstack checkout by camera-box and obs, so this
# profile is the one both get. Cargo reads profiles only from the workspace root: an app that pulls
# vstack in as a git dependency builds it with that app's own profile.
[profile.release]
lto = true
codegen-units = 1
strip = true

# cargo-mutants builds every mutant with this profile: no debug info, so each rebuild is short.
[profile.mutants]
inherits = "test"
debug = "none"
